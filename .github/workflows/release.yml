name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable + universal targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: npm ci

      - name: Build macOS universal app
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Copy DMG to pawgress_executables
        shell: bash
        run: |
          OUT="$HOME/pawgress_executables/mac"
          mkdir -p "$OUT"
          find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" \
            -exec cp {} "$OUT/" \;
          echo "DMG copied to $OUT"
          ls -lh "$OUT"
